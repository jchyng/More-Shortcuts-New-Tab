name: Deploy to Chrome Web Store

on:
  push:
    branches:
      - main
    paths:
      - 'manifest.json'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Zip extension
        # Git에 등록된 확장 프로그램 파일만 압축합니다.
        run: git archive --format=zip --output=extension.zip HEAD

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          file-path: extension.zip
          # 검토가 필요한 버전은 API publish가 400으로 거절될 수 있으므로
          # 업로드만 자동화하고 Developer Dashboard에서 수동 게시합니다.
          publish: false
