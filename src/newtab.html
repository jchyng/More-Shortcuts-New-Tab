<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link id="pageFavicon" rel="icon" type="image/png" sizes="32x32" href="../assets/icons/tab-icon-dark-v2-32.png">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="top-header">
        <a href="https://mail.google.com" class="header-link" title="Gmail">
            <img src="../assets/icons/gmail.png" alt="Gmail" class="header-icon">Gmail
        </a>
        <a href="https://drive.google.com/drive/my-drive" class="header-link" title="Google Drive">
            <img src="../assets/icons/google-drive.png" alt="Google Drive" class="header-icon">Drive
        </a>
        <a href="https://meet.google.com" class="header-link" title="Google Meet">
            <img src="../assets/icons/google-meet.svg" alt="Google Meet" class="header-icon">Meet
        </a>
        <a href="https://calendar.google.com" class="header-link" title="Google Calendar">
            <img src="../assets/icons/google-calendar.png" alt="Google Calendar" class="header-icon">Calendar
        </a>
        <a href="https://photos.google.com" class="header-link" title="Google Photos">
            <img src="../assets/icons/google-photos.png" alt="Google Photos" class="header-icon">Photos
        </a>
        <button id="themeToggle" class="icon-btn" title="Toggle Theme">
            <span class="material-icons">dark_mode</span>
        </button>
        <button id="customizeBtn" class="icon-btn" title="Customize">
            <span class="material-icons">settings</span>
        </button>

    </header>

    <div class="main-container">
        <div class="clock-container">
            <div id="digitalClock" class="clock-text"></div>
            <div id="dateText" class="date-text"></div>
        </div>

        <div class="search-bar" id="searchBar">
            <div class="search-input-wrapper">
                <span class="material-icons search-icon">search</span>
                <input type="text" id="searchInput" placeholder="Search Google or type a URL" autocomplete="off">
            </div>
            <div class="search-actions">
                <button class="action-icon" id="imageSearchBtn" type="button" title="Search by image with Google Lens" aria-label="Search by image with Google Lens">
                    <img
                            class="lens-icon"
                            src="../assets/icons/google-lens-dark.png"
                            alt=""
                    >
                </button>
                <button id="aiModeBtn" class="ai-mode-btn">
                    <img
                            class="ai-mode-icon"
                            src="../assets/icons/search-spark-dark.png"
                            alt=""
                    >
                    <span class="btn-text">AI Mode</span>
                </button>
            </div>
            <ul id="searchSuggestions" class="search-suggestions"></ul>
        </div>

        <div class="shortcuts-slider">
            <div class="shortcuts-wrapper" id="shortcutsWrapper">
                </div>
        </div>
        
        <div class="pagination-dots" id="paginationDots"></div>
    </div>

    <dialog id="addModal">
        <form id="addForm" method="dialog">
            <h3 id="modalHeader">Add Shortcut</h3>
            <div class="input-group">
                <label for="modalUrl">URL</label>
                <input type="url" id="modalUrl" placeholder="https://" required autofocus>
            </div>
            <div class="input-group">
                <label for="modalTitle">Name</label>
                <input type="text" id="modalTitle" placeholder="e.g. YouTube" required>
            </div>
            <div class="modal-actions">
                <button type="button" id="cancelBtn">Cancel</button>
                <button type="submit" class="primary" id="submitBtn">Add</button>
            </div>
        </form>
    </dialog>

    <dialog id="customizeModal" class="customize-modal">
        <div class="customize-content">
            <div class="customize-header">
                <h3>Customize</h3>

                <button id="closeCustomizeBtn" class="icon-btn">
                    <span class="material-icons">close</span>
                </button>
            </div>

            <div class="customize-section">
                <label for="themeSelect">Theme</label>

                <div class="theme-picker" id="themePicker">
                    <button id="themeSelect" class="theme-picker-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                        <span id="themeSelectValue">System</span>
                        <span class="material-icons theme-picker-arrow">expand_more</span>
                    </button>
                    <div class="theme-picker-options" id="themeOptions" role="listbox" hidden>
                        <button type="button" role="option" data-value="system">System</button>
                        <button type="button" role="option" data-value="light">Light</button>
                        <button type="button" role="option" data-value="dark">Dark</button>
                    </div>
                </div>
            </div>

            <div class="customize-section customize-toggle-row">
                <div>
                    <label for="reverseSearchColors">Reverse search bar colors</label>
                    <span class="customize-hint">Use the opposite color scheme for the search bar</span>
                </div>
                <label class="toggle-switch" for="reverseSearchColors">
                    <input type="checkbox" id="reverseSearchColors">
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="customize-section customize-toggle-row">
                <div>
                    <label for="use24HourClock">Use 24-hour clock</label>
                    <span class="customize-hint">Show time in 24-hour format instead of AM/PM</span>
                </div>
                <label class="toggle-switch" for="use24HourClock">
                    <input type="checkbox" id="use24HourClock">
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="customize-section">
                <label>Color theme</label>
                <div class="color-theme-grid" id="colorThemeOptions" aria-label="Color theme">
                    <button type="button" class="color-theme-swatch neutral" data-theme-color="neutral" data-color="" title="Neutral" aria-label="Neutral"></button>
                    <button type="button" class="color-theme-swatch" data-theme-color="black" data-color="#111111" title="Black" aria-label="Black"></button>
                    <button type="button" class="color-theme-swatch" data-theme-color="white" data-color="#f5f5f5" title="White" aria-label="White"></button>
                    <button type="button" class="color-theme-swatch" data-theme-color="slate" data-color="#94a3b8" title="Slate" aria-label="Slate"></button>
                    <button type="button" class="color-theme-swatch" data-theme-color="red" data-color="#ef6b73" title="Red" aria-label="Red"></button>
                    <button type="button" class="color-theme-swatch" data-theme-color="coral" data-color="#f58b6b" title="Coral" aria-label="Coral"></button>
                    <button type="button" class="color-theme-swatch" data-theme-color="amber" data-color="#eebd55" title="Amber" aria-label="Amber"></button>
                    <button type="button" class="color-theme-swatch" data-theme-color="lime" data-color="#9bcf62" title="Lime" aria-label="Lime"></button>
                    <button type="button" class="color-theme-swatch" data-theme-color="green" data-color="#65c98f" title="Green" aria-label="Green"></button>
                    <button type="button" class="color-theme-swatch" data-theme-color="cyan" data-color="#62c7d9" title="Cyan" aria-label="Cyan"></button>
                    <button type="button" class="color-theme-swatch" data-theme-color="blue" data-color="#789de5" title="Blue" aria-label="Blue"></button>
                    <button type="button" class="color-theme-swatch" data-theme-color="violet" data-color="#a78bda" title="Violet" aria-label="Violet"></button>
                    <button type="button" class="color-theme-swatch" data-theme-color="purple" data-color="#c17bd4" title="Purple" aria-label="Purple"></button>
                    <button type="button" class="color-theme-swatch" data-theme-color="pink" data-color="#e982b0" title="Pink" aria-label="Pink"></button>
                </div>
            </div>

            <div class="customize-section">
                <label>Background</label>

                <div class="wallpaper-gallery" id="wallpaperGallery"></div>

                <div class="upload-row">
                    <label for="backgroundInput" class="customize-btn">
                        <span class="material-icons">upload</span>
                        Upload
                    </label>
                    <input
                            type="file"
                            id="backgroundInput"
                            accept="image/*"
                            hidden
                    >

                    <button id="removeBackgroundBtn" class="customize-btn" type="button">
                        <span class="material-icons">delete_outline</span>
                        Remove
                    </button>
                </div>
            </div>

            <div class="customize-section">
                <label for="backgroundDim">
                    Wallpaper darkness
                </label>

                <input
                        type="range"
                        id="backgroundDim"
                        min="0"
                        max="80"
                        value="20"
                >
            </div>
        </div>
    </dialog>

    <script src="js/storage.js"></script>
    <script src="js/favicons.js"></script>
    <script src="js/dragdrop.js"></script>
    <script src="js/shortcuts.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/search.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/customize.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
